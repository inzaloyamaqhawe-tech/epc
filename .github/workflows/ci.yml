name: Validate Bolide EPC
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
      - name: Run behavioral tests
        run: node --test tests/*.test.js
      - name: Check production dependency advisories
        run: pnpm audit --prod
      - name: Verify container build
        run: docker build --tag bolide-epc:ci .
      - name: Package tracked source only
        run: git archive --format=zip --output=bolide-epc-source.zip HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bolide-epc-source
          path: bolide-epc-source.zip
          retention-days: 14
